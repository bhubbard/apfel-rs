name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build & Release (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Compile optimized release binary
        run: cargo build --release --locked

      - name: Strip binary or verify signature
        run: |
          strip target/release/apfel || true
          codesign --verify --verbose target/release/apfel || true

      - name: Create tarball
        run: |
          tar -czvf apfel-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz -C target/release apfel

      - name: Generate SHA256 checksum
        run: |
          shasum -a 256 apfel-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz > apfel-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apfel-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            apfel-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
