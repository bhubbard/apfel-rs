[package]
name = "apfel-rs"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard", "apfel-rs contributors"]
license = "MIT"
description = "High-performance Rust fork of apfel: Apple Intelligence and FoundationModels from the command line and OpenAI-compatible server"
repository = "https://github.com/bhubbard/apfel-rs"
keywords = ["apple-intelligence", "foundation-models", "llm", "openai", "mcp"]
categories = ["command-line-utilities", "web-programming::http-server"]

[lib]
name = "apfel"
path = "src/lib.rs"

[[bin]]
name = "apfel"
path = "src/bin/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
futures = "0.3"
async-stream = "0.3"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustyline = "15.0"
colored = "3.0"
libc = "0.2"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.12"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
